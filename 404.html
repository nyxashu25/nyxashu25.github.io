<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Ashutosh Singh</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #22d3ee; --green: #3fb950;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font: 16px/1.6 var(--sans); }
.term { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.bar { display: flex; align-items: center; gap: 7px; padding: 11px 14px; border-bottom: 1px solid var(--border); background: #11161d; }
.bar i { width: 11px; height: 11px; border-radius: 50%; display: block; }
.bar i:nth-child(1) { background: #ff5f56; } .bar i:nth-child(2) { background: #ffbd2e; } .bar i:nth-child(3) { background: #27c93f; }
.bar span { margin-left: 8px; font: 12px var(--mono); color: var(--muted); }
.body { padding: 22px 24px 26px; font: 15px/1.8 var(--mono); }
.p { color: var(--green); } .m { color: var(--muted); } .k { color: var(--accent); }
h1 { margin: 0 0 4px; font: 700 40px/1.1 var(--mono); }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
</style>
</head>
<body>
<main class="term">
  <div class="bar"><i></i><i></i><i></i><span>404.sh</span></div>
  <div class="body">
    <h1>404</h1>
    <p class="m" style="margin:0 0 14px">That page does not exist.</p>
    <div><span class="p">$ </span>cd <span class="k">~</span></div>
    <div><span class="p">$ </span><a href="/">open the portfolio</a></div>
    <div><span class="p">$ </span><a href="/#work">see my work</a></div>
  </div>
</main>
</body>
</html>
